[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "Driver Monitoring System leve para Raspberry Pi 4B"
readme = "README.md"
requires-python = ">=3.11"
# cv2 vem de opencv-contrib-python, dependência do mediapipe. Não adicionar
# opencv-python-headless aqui: os dois instalam o mesmo módulo e conflitam.
dependencies = [
    "mediapipe>=1.2,<2",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# Só no notebook. Instale o torch antes, pelo índice CPU (ver README), senão o pip
# baixa as wheels com CUDA. O litert-torch exige torch < 2.15.
train = [
    "torch>=2.14,<2.15",
    "torchvision",
    "litert-torch>=0.10,<0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
